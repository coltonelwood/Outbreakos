name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force GitHub's bundled JS actions (checkout, setup-node, cache) onto the
# Node 24 runtime so we don't get the Node 20 deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          SESSION_SECRET: ci-only-non-production-secret
        run: npm run build
